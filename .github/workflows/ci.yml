# Проверки на каждый push и pull request: тесты API и бота на настоящем
# PostgreSQL, миграции Alembic, проверка типов и сборка сайта.
name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: edu_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Зависимости
        run: pip install -e "./backend[dev]" -r bot/requirements.txt pytest-github-actions-annotate-failures
      - name: Тесты API на SQLite
        working-directory: backend
        run: pytest -q
      - name: Тесты API на PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/edu_test
        run: pytest -q
      - name: Тесты бота на PostgreSQL
        working-directory: bot
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/edu_test
        run: pytest -q
      - name: Миграции Alembic (вперёд, сверка с моделями, назад)
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/edu_test
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/edu_test" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
